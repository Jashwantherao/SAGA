[project]
name = "saga"
version = "0.1.0"
description = "Autonomous multi-agent pipeline that generates and verifies playable Godot games"
readme = "README.md"
authors = [
    { name = "Jashwanth", email = "jashwantherao2@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.7",
    "llvmlite>=0.41",
    "numba>=0.58",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "onnxruntime<1.24",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "psutil>=7.0.0",
    "python-dotenv>=1.2.2",
    "rembg>=2.0.69",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
saga = "saga.main:main"
saga-doctor = "saga.doctor:main"
saga-ui-api = "saga.ui_api:main"
saga-benchmark = "saga.benchmark:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
